name: Tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q gate
      - run: bash -n install.sh
      - run: node --input-type=module --check < extension/extension.js
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 dbus-x11 xvfb
      - run: dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/desktop_smoke.py
